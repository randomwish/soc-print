name: Build

# Standalone executables for each OS. Every push builds and smoke-tests them;
# pushing a tag like v0.2.0 also publishes them as a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: an older glibc, so the Linux build runs on more distributions.
        # No Intel Mac build: pikepdf no longer publishes wheels for it.
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Build
        shell: bash
        run: uv run --with "pyinstaller>=6.10" python packaging/build.py

      - name: Smoke test the executable
        shell: bash
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          exe=dist/soc-print
          [ "$RUNNER_OS" = Windows ] && exe=dist/soc-print.exe
          uv run python tests/smoke_exe.py "$exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/soc-print-*.tar.gz
            dist/soc-print-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "SoC Print ${GITHUB_REF_NAME#v}" --generate-notes
