name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }} · ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.13", backend: openssh }
          - { os: ubuntu-latest, python: "3.10", backend: openssh }
          - { os: ubuntu-latest, python: "3.13", backend: paramiko }
          - { os: macos-latest, python: "3.13", backend: openssh }
          - { os: windows-latest, python: "3.13", backend: paramiko }
          - { os: windows-latest, python: "3.10", backend: paramiko }
    env:
      SOC_PRINT_SSH_BACKEND: ${{ matrix.backend }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      # Ghostscript needs its recommended fonts (fonts-urw-base35) to render text;
      # poppler-utils gives the tests pdftotext and pdfimages.
      - name: Install Ghostscript, poppler and LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ghostscript poppler-utils
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui

      - name: Install Ghostscript and poppler (macOS)
        if: runner.os == 'macOS'
        run: brew install ghostscript poppler

      # Installed the way a user would, outside PATH, so discovery is tested too.
      - name: Install Ghostscript (Windows)
        if: runner.os == 'Windows'
        run: choco install ghostscript -y --no-progress

      - name: Versions
        shell: bash
        run: |
          uv run python --version
          ssh -V || true
          uv run python -c "from socprint import pdfprep, ssh; print('backend:', ssh.default_backend()); print('gs:', pdfprep.find_ghostscript()); print('office:', pdfprep.find_office())"

      - name: Tests
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          # The fixtures default to $XDG_RUNTIME_DIR (/run/user/...), which Ubuntu's
          # Ghostscript refuses to read from (the app itself works in ~/.cache).
          # Keep it short: ssh control sockets live under it.
          SOC_PRINT_TEST_ROOT: ${{ runner.os == 'Linux' && '/tmp' || '' }}
        run: uv run pytest -v -rs

      - name: Start-up smoke test
        shell: bash
        run: |
          uv run python - <<'EOF'
          import json, os, subprocess, sys, tempfile, time, urllib.request
          home = tempfile.mkdtemp()
          env = {**os.environ, "XDG_CONFIG_HOME": home, "XDG_CACHE_HOME": home,
                 "PYTHON_KEYRING_BACKEND": "keyring.backends.null.Keyring"}
          proc = subprocess.Popen([sys.executable, "-m", "socprint", "--no-open", "--port", "6399"],
                                  env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          try:
              for _ in range(60):
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:6399/api/ping", timeout=2) as r:
                          body = json.load(r)
                      break
                  except OSError:
                      if proc.poll() is not None:
                          sys.exit("server exited:\n" + proc.stdout.read())
                      time.sleep(0.5)
              else:
                  sys.exit("server never answered /api/ping")
              assert body.get("app") == "soc-print", body
              with urllib.request.urlopen("http://127.0.0.1:6399/", timeout=5) as r:
                  assert b"SoC Print" in r.read()
              print("ok:", body)
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  proc.kill()
          EOF

      - name: Windows launcher, install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /c "soc-print.cmd --version"
          if ($LASTEXITCODE -ne 0) { throw "soc-print.cmd failed" }
          uv run python -m socprint install --port 6398
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          $programs = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          foreach ($link in "Startup\SoC Print.lnk", "SoC Print.lnk") {
            if (-not (Test-Path (Join-Path $programs $link))) { throw "missing $link" }
          }
          $ok = $false
          foreach ($i in 1..30) {
            try { $r = Invoke-RestMethod http://127.0.0.1:6398/api/ping; if ($r.app -eq "soc-print") { $ok = $true; break } } catch {}
            Start-Sleep -Milliseconds 500
          }
          if (-not $ok) { throw "installed instance didn't start" }
          uv run python -m socprint uninstall
          if (Test-Path (Join-Path $programs "SoC Print.lnk")) { throw "uninstall left the shortcut" }
          Get-Process pythonw -ErrorAction SilentlyContinue | Stop-Process -Force
